<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVIMA CONSCIENTE · Cartilla interactiva NO ES NORMAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="sello"><span class="chk"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg></span>INVIMA <span>CONSCIENTE</span></div>
    <div class="crumb" id="crumb"></div>
    <div class="prog" id="prog" title="Tu avance"><i></i></div>
    <button class="tbtn" id="panelbtn" style="display:none"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Panel</button>
    <button class="tbtn" id="tocbtn" aria-label="Abrir contenido"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Contenido</button>
  </header>
  <main class="viewport"><div class="stage-wrap" id="sw"><div class="stage" id="stage"></div></div></main>
  <nav class="navbar" aria-label="Navegación de páginas">
    <button class="nbtn" id="prev" aria-label="Página anterior"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dots" id="dots"></div>
    <span class="pcount" id="pcount"></span>
    <button class="nbtn next" id="next" aria-label="Página siguiente"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </nav>
</div>
<div class="drawer" id="drawer" aria-hidden="true"><div class="scrim"></div>
  <div class="panel" role="dialog" aria-label="Contenido de la cartilla">
    <div class="row" style="justify-content:space-between;align-items:center"><div class="sello"><span class="chk"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M4 12.5l5 5L20 6"/></svg></span>Contenido</div><button class="tbtn" id="tocclose" aria-label="Cerrar">Cerrar</button></div>
    <nav class="toc" id="toc"></nav>
  </div></div>
<div class="toast" id="toast" role="status"></div>
<script src="js/data.js"></script>
<script src="js/ilustra.js"></script>
<script src="js/app.js"></script>
</body>
</html>
